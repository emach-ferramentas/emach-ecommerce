name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun run test:lint-rules
      - run: bun run test:repo
      - run: bun check-types
      - run: bun run test:ci

  # O `next build` consulta o banco no generateStaticParams. Aqui ele roda contra
  # um Postgres descartável do próprio job, nunca contra o Supabase compartilhado.
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun scripts/dummy-env.ts >> "$GITHUB_ENV"
      - name: Schema, triggers e fixture no Postgres do job
        working-directory: packages/db
        run: |
          case "$DATABASE_URL" in
            *@localhost:*) ;;
            *) echo "::error::DATABASE_URL não aponta para o Postgres do job"; exit 1 ;;
          esac
          bunx drizzle-kit push --force
          bun db:apply-triggers
          bun db:seed-categories
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../.github/ci/build-fixture.sql
      - run: bun run --filter=web build

  check-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Drift-check de env vars contra a Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::error::VERCEL_TOKEN ausente. Sem ele a main deploya sem conferir as env vars da Vercel."
              exit 1
            fi
            echo "::warning::VERCEL_TOKEN ausente neste PR (fork não recebe secrets); pulando drift-check."
            exit 0
          fi
          bun check:env
